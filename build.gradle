plugins {
    id 'java'
    alias(libs.plugins.shadow)
    alias(libs.plugins.spotless)
}

import org.gradle.jvm.tasks.Jar

group = 'net.kroet.underwatertrees'

def versionProps = new Properties()
def versionFile = file('version.properties')
if (versionFile.exists()) {
    versionFile.withInputStream { versionProps.load(it) }
}
def resolvedVersion = versionProps.getProperty('version')
if (resolvedVersion == null || resolvedVersion.trim().isEmpty()) {
    resolvedVersion = providers.gradleProperty('version').getOrElse('1.0-SNAPSHOT')
}
version = resolvedVersion

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

repositories {
    // No mavenLocal(): turtle-lib is resolved below (project dependency or GitHub Releases),
    // and resolving other coordinates from the local Maven cache first would let a stale or
    // tampered local artifact silently win over Maven Central, and make builds machine-dependent.
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = uri('https://repo.papermc.io/repository/maven-public/')
    }
    // turtle-lib comes only from its GitHub Release assets, and nothing else is read from there.
    // Tag name and release-asset filename must match libs.versions.toml exactly
    // (turtle-lib-paper-<version>.jar), or resolution fails with a 404.
    exclusiveContent {
        forRepository {
            ivy {
                url = uri('https://github.com/hrobasti/turtle-lib/releases/download')
                patternLayout {
                    artifact '[revision]/[artifact]-[revision].[ext]'
                }
                metadataSources { artifact() }
            }
        }
        filter { includeGroup 'turtle-lib' }
    }
}

dependencies {
    // paper-api also brings Adventure/MiniMessage and Gson, which Paper provides
    // at runtime, so neither is declared or shaded here.
    compileOnly libs.paper.api
    // Read like settings.gradle does, so both agree on every value (e.g. "1").
    if (Boolean.parseBoolean(providers.gradleProperty('useLocalTurtleLib').getOrElse('false'))) {
        implementation project(':plugins:turtle-lib')
    } else {
        implementation libs.turtle.lib
    }
    // Real dependency (not compileOnly): Paper doesn't provide bStats, so it must be
    // shaded into the jar. relocate()'d below into our own package per bStats' license
    // terms.
    implementation libs.bstats.bukkit
    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
    // YamlConfiguration/ConfigurationSection are fully self-contained (no running server
    // needed), so ConfigKeyMigrator-related tests can use them directly as test fixtures.
    testImplementation libs.paper.api
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def pluginVersionString = project.version.toString()
tasks.named('processResources') {
    inputs.property('version', pluginVersionString)
    filesMatching('paper-plugin.yml') {
        expand(version: pluginVersionString)
    }
}

tasks.register('cleanDist', Delete) {
    delete layout.projectDirectory.dir('dist')
}

tasks.named('shadowJar') {
    dependsOn tasks.named('cleanDist')
    archiveBaseName.set('underwatertrees-paper')
    archiveVersion.set(project.version.toString())
    archiveClassifier.set('')
    destinationDirectory.set(layout.projectDirectory.dir('dist'))
    relocate 'org.bstats', 'net.kroet.underwatertrees.bstats'
    // Own license at the jar root, next to licenses/.
    from(layout.projectDirectory.file('LICENSE'))
    // Test-only TurtleLib helper; the plugin never uses it at runtime.
    exclude 'net/kroet/turtlelib/helper/LocaleFileChecker*'
    // TurtleLib's license ships as licenses/turtle-lib-MIT.txt instead.
    exclude 'META-INF/LICENSE'
}

tasks.named('sourcesJar', Jar) {
    dependsOn tasks.named('cleanDist')
    archiveBaseName.set('underwatertrees-paper')
    archiveVersion.set(project.version.toString())
    archiveClassifier.set('sources')
    destinationDirectory.set(layout.projectDirectory.dir('dist/sources'))
    // Own license at the jar root, like in the plugin jar.
    from(layout.projectDirectory.file('LICENSE'))
}

tasks.named('jar') {
    enabled = false // rely on shaded underwatertrees-paper artifact
}

// Local SHA-256 checksums next to each release jar, verifiable with `sha256sum -c`.
// Every jar task triggers it, so a partial build never leaves a jar without one.
def distDir = layout.projectDirectory.dir('dist')
tasks.register('checksumDist') {
    mustRunAfter tasks.named('shadowJar'), tasks.named('sourcesJar')
    def jars = fileTree(distDir) { include '**/*.jar' }
    doLast {
        jars.files.each { jarFile ->
            def digest = java.security.MessageDigest.getInstance('SHA-256').digest(jarFile.bytes)
            def sha256 = digest.collect { String.format('%02x', it & 0xff) }.join()
            new File(jarFile.parentFile, "${jarFile.name}.sha256").text = "${sha256}  ${jarFile.name}\n"
        }
    }
}

tasks.named('shadowJar') {
    finalizedBy tasks.named('checksumDist')
}

tasks.named('sourcesJar') {
    finalizedBy tasks.named('checksumDist')
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
    dependsOn tasks.named('sourcesJar')
    dependsOn tasks.named('checksumDist')
}

tasks.named('clean') {
    delete layout.projectDirectory.dir('dist')
}

// Enforced Java formatting via the DiffPlug Spotless plugin using Eclipse's JDT
// formatter (deliberately not Google's or Palantir's). `spotlessCheck` runs as part
// of `check`, so `./gradlew build` fails on unformatted code; run `spotlessApply` to fix.
spotless {
    // Preserve each file's existing line-ending style (repo mixes LF and CRLF per
    // .gitattributes); only whitespace/newline hygiene is enforced below, not EOL style.
    lineEndings = com.diffplug.spotless.LineEnding.PRESERVE
    java {
        target 'src/**/*.java'
        // Import steps run first so the Eclipse formatter has the last word on layout.
        removeUnusedImports()
        importOrder()
        forbidWildcardImports()
        eclipse().configFile('config/spotless-eclipse-formatter.properties')
        toggleOffOn()
        trimTrailingWhitespace()
        endWithNewline()
        leadingTabsToSpaces(4)
    }
    format 'resources', {
        target 'src/**/*.yml', 'src/**/*.yaml', 'src/**/*.properties', 'src/**/*.txt'
        // Byte-exact old release defaults (upgrade baseline and test input), and
        // license texts copied verbatim from their upstream sources.
        targetExclude 'src/main/resources/legacy/**', 'src/test/resources/release-*/**',
                'src/main/resources/licenses/**'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

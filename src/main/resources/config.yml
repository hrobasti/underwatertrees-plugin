# UnderwaterTrees configuration file

#################################################
# General
#################################################

# Language code of the file in lang/ used for messages (e.g. de_DE; default: en_US).
language: "en_US"

# Text shown between the colored brackets of the chat prefix.
chat_prefix_label: "UwTrees"

# Show the startup banner in the console when the plugin enables.
startup_banner_enabled: true

# Automatically reload when this file changes on disk.
# When disabled, use /underwatertrees reload to apply changes.
# A version of this file that isn't valid YAML is never applied by a reload: the
# previous settings stay active, and the console names the line with the error
# (at startup the defaults are used until it is fixed).
# Nor is an emptied or deleted file: the console warns, /underwatertrees reload
# or a restart then writes the default settings.
config_watch_enabled: true

# Seconds between checks for changes to this file (minimum 1).
config_watch_interval_seconds: 5

# Log a summary of the loaded configuration on startup and on reload.
log_stats: true

# Also list each enabled soil and sapling individually.
log_detail: false

# Send anonymous usage statistics to bStats (https://bstats.org).
metrics_enabled: true

#################################################
# Update mechanics
#################################################

update_check:
    # Master switch for update checks (Modrinth/Hangar).
    enabled: true
    # 0 = Modrinth + Hangar, 1 = only Modrinth, 2 = only Hangar
    provider: 0
    # Hours between automatic update checks (minimum 1).
    interval_hours: 24
    # Include beta/alpha versions when determining the latest version.
    include_prereleases: false
    # Only report builds made for the server's Minecraft version (builds without
    # version info count only if none matches).
    filter_by_server_version: true
    # Log update availability and unreachable platforms to the console.
    notify_console: true
    # Also log the provider summary once after each start/reload when no update is available.
    notify_console_always_shown: false
    # Notify ops on join when an update is available.
    notify_op_join: true

#################################################
# Placement Rules
#################################################

# Underwater planting always needs water in the target space; planting on land is left to vanilla.
# If true, bubble columns don't count, and physics protection only holds while water sits directly above the sapling.
require_water_above: false

# Keep flowing water from washing away saplings that sit underwater (water directly above) on an allowed soil.
# Lava and saplings on land are not affected and behave as in vanilla.
protect_underwater_saplings: true

#################################################
# Growth Overrides
#################################################

# Let UnderwaterTrees grow underwater saplings where the light is too low for vanilla growth.
# Vanilla saplings only grow at light level 9 or higher.
growth_light_override:
    # Master switch for overriding light checks (default true so underwater saplings can thrive).
    enabled: true
    # Minimum light level (0-15) before the plugin forces growth attempts. 0 lets saplings grow even on the pitch-dark
    # deep-sea floor; raise it to keep dark spots from growing. Invalid values fall back to vanilla (9).
    minimum_level: 0
    # Interval in seconds between automatic growth scans (minimum 1 second).
    attempt_period_seconds: 60
    # Chance (0-1) that a tracked sapling attempts to grow each scan. Lower values mimic vanilla pacing (~1 attempt/minute).
    attempt_chance: 0.25

#################################################
# Materials
#################################################

# Allowed soils. Add more keys as needed.
# Entries you delete stay deleted; new entries from updates are added once.
soils:
    DIRT: true
    GRASS_BLOCK: true
    PODZOL: true
    COARSE_DIRT: true
    ROOTED_DIRT: true
    MOSS_BLOCK: true
    MUD: true
    SAND: false
    RED_SAND: false

# Allowed saplings, as Minecraft material names (e.g. CHERRY_SAPLING).
# Custom items from other plugins aren't supported.
# Entries you delete stay deleted; new entries from updates are added once.
saplings:
    OAK_SAPLING: true
    SPRUCE_SAPLING: true
    BIRCH_SAPLING: true
    JUNGLE_SAPLING: true
    ACACIA_SAPLING: true
    DARK_OAK_SAPLING: true
    PALE_OAK_SAPLING: true
    CHERRY_SAPLING: true
    POPLAR_SAPLING: true
    MANGROVE_PROPAGULE: false # already water-placeable in vanilla, should be disabled to keep that behavior
